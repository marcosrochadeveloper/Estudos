<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: darkseagreen;
        }

        div#container {
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 300px;
            height: 165px;
            border-radius: 20px;
            background-color: darkgreen;
        }

        div#tempo {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            font-weight: bolder;
            width: 270px;
            height: 75px;
            border-radius: 20px;
            background-color: #bbffc6;
        }

        div#botoes button {
            background-color: rgb(109, 205, 122);
            cursor: pointer;
            padding: 10px;
            font-size: 1.3em;
            font-weight: bolder;
            border-radius: 20px;
        }

        div#botoes button:hover {
            background-color: rgb(30, 135, 61);
            color: white;
        }

        img {
            position: absolute;
            margin-left: -15px;
            margin-top: -5px;
            width: 75px;
        }

    </style>
</head>
<body>
    <main>
        <div id="container">
            <div id="tempo">
                <div id="center">
                    <span id="spanhoras">00</span> 
                    : <span id="spanminutos">00</span> 
                    : <span id="spansegundos">00</span>
                </div>
            </div>
            <div id="botoes">
                <button onclick="iniciar()">Iniciar</button>
                <button onclick="parar()">Parar</button>
                <button onclick="reiniciar()">Reiniciar</button>
            </div>
        </div>
    </main>
</body>
<script>
    let horas = 0;
    let minutos = 0;
    let segundos = 0;

    let cont = 0;

    let intervalo;

    function contagem (){
        spansegundos.innerHTML = `${segundos.toString().padStart(2, '0')}`;
        spanminutos.innerHTML = `${minutos.toString().padStart(2, '0')}`;
        spanhoras.innerHTML = `${horas.toString().padStart(2, '0')}`;

        segundos += 1;
        if (segundos == 59) {
            segundos = 0;
            minutos += 1;
        }
    }

    function iniciar(){
        intervalo = setInterval(contagem, 1000);
    }

    function parar(){
        clearInterval(intervalo);
    }

    function reiniciar(){
        parar();
        spansegundos.innerHTML = `
        <span style="color: #bbffc6">
            <img src="explosion.gif">
            00
        </span>`;
        spanminutos.innerHTML = `
        <span style="color: #bbffc6">
            <img src="explosion.gif">
            00
        </span>`;
        spanhoras.innerHTML = `
        <span style="color: #bbffc6">
            <img src="explosion.gif">
            00
        </span>`;
        setTimeout(() => {
            horas = 0;
            minutos = 0;
            segundos = 0;
            contagem ();
        }, 1000);
    }

</script>
</html>
